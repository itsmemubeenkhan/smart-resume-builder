name: Build AAB & APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/release.jks
          KEYSTORE_PASSWORD: smartresume2026
          KEY_ALIAS: smart-resume
          KEY_PASSWORD: smartresume2026
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/release.jks
          KEYSTORE_PASSWORD: smartresume2026
          KEY_ALIAS: smart-resume
          KEY_PASSWORD: smartresume2026
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: smart-resume-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-resume-apk
          path: build/app/outputs/flutter-apk/app-release.apk
